name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        r-version: ['4.2', '4.3']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libpng-dev libjpeg-dev libharfbuzz-dev libfribidi-dev libxml2-dev gfortran libblas-dev liblapack-dev libuv1-dev libssl-dev
      shell: bash
    
    - name: Set up R ${{ matrix.r-version }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}
        use-public-rspm: true
    
    - name: Install dependencies
      run: |
        install.packages(c('Matrix', 'shiny', 'bslib', 'survival', 'survminer', 'dplyr', 'ggplot2', 'DT', 'shinycssloaders', 'shinyjs', 'bsicons', 'randomForestSRC', 'testthat', 'rcmdcheck'))
      shell: Rscript {0}

    - name: Run tests
      run: |
        testthat::test_dir('tests/')
      shell: Rscript {0}

    - name: Check R CMD
      run: |
        rcmdcheck::rcmdcheck(args = c('--no-tests'), error_on = 'error')
      shell: Rscript {0}

  docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: docker build -t oncostratify:test .
    
    - name: Test Docker image
      run: |
        docker run --rm \
          -p 3838:3838 \
          -e SHINY_PORT=3838 \
          --health-cmd="curl -f http://localhost:3838/ || exit 1" \
          --health-interval=10s \
          --health-timeout=5s \
          --health-retries=3 \
          oncostratify:test &
        sleep 15
        curl -f http://localhost:3838/ || exit 1
